{% extends "base.html" %}

{% block contenido %}
<style>
    /* --- ESTILOS PROPIOS DEL FORMULARIO PARA ASEGURAR EL DISEÑO DE 3 COLUMNAS --- */
    .page {
        padding: 20px;
        display: flex;
        justify-content: center;
    }

    .form-container {
        width: 100%;
        max-width: 1200px;
        background: #fff;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .form-header {
        margin-bottom: 20px;
        border-bottom: 1px solid #dee2e6;
        padding-bottom: 10px;
    }

    .form-header h2 {
        font-size: 20px;
        color: #333;
        margin: 0;
    }

    .form-header p {
        color: #666;
        font-size: 13px;
        margin: 5px 0 0;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    @media (max-width: 900px) {
        .grid {
            grid-template-columns: 1fr;
        }
    }

    .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .field label {
        font-size: 12px;
        font-weight: 600;
        color: #444;
    }

    .field input, .field select {
        padding: 8px;
        font-size: 12px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        width: 100%;
        background-color: #fff;
    }

    .actions {
        margin-top: 25px;
        display: flex;
        gap: 10px;
        justify-content: flex-start;
    }

    .btn-save {
        background-color: #198754;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
        font-weight: 500;
    }

    .btn-cancel {
        background-color: #6c757d;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
        font-weight: 500;
    }

    .btn-save:hover, .btn-cancel:hover {
        opacity: 0.9;
    }
</style>

<div class="page">

    <div class="form-container">

        <div class="form-header">
            <h2>{{ '✏️ Editar Pase - Regulatorio' if pase else '🚀 Nuevo Pase - Regulatorio' }}</h2>
            <p>Complete la información del pase</p>
        </div>

        <form id="pasesForm" class="form-card">

            <input type="hidden" name="index" value="{{ index }}">
            <input type="hidden" name="id" value="{{ pase.id if pase else '' }}">

            <div class="grid">

                <!-- COLUMNA 1 -->
                <div class="col">

                    <div class="field">
                        <label>Fecha</label>
                        <input type="date" name="fecha" value="{{ pase.fecha if pase else '' }}" required>
                    </div>

                    <div class="field">
                        <label>Proceso</label>
                        <select name="proceso" required>
                            {% for dev in ['RTSRA-RENTESEG-REGISTRO DE ABONADOS',
                                                        'RTSVN-RENTESEG-VINCULACIONES', 
                                                        'RTSEXL-RENTESEG-LISTA DE EXCEPCION', 
                                                        'RTSCLN-RENTESEG-CLONADOS',
                                                        'RTSCDR-RENTESEG-GESTION DE CDR',                                    
                                                        'TRAFICO',
                                                        'SONDIF-SONDAS FIJAS',
                                                        'SONDIM-SONDAS MÓVILES',
                                                        'DEVOLM-DEVOLUCIONES MÓVILES',
                                                        'ANTARQSEGSCOR-ANTARQUI',
                                                        'ANTARQGENLEY-GENERALES DE LEY',
                                                        'USPROH-REPORTE UPS',
                                                        'SGMPLAREPPLAN-SEGMENTACION DE PLANES',
                                                        'LLAMALISN-LLAMALI',
                                                        'GDCDATCNSDATO-GRAFICA DE CONSUMO DE DATOS POR RECIBO',
                                                        'CTRTRFCUR-CONTROL DE TRAFICO CURSADO MOVIL Y FIJA',
                                                        'ABOSMS-EXTRACCION MOVIL ABONADOS SMS',
                                                        'GSMTUPRUR-TUPS GSM RURAL',
                                                        'IDNIMSI-IDENTIFICACION DE IMSI',
                                                        'FWKLOG-FRAMEWORK DE LOGS',
                                                        'ALERTAAGRALT-MONITOREO DE NUEVAS ALTAS',
                                                        'RTSTRI-F1 CDR',
                                                        'RTSTRIRAF1-F2 SISTEMA COMERCIAL REGISTRO DE ABONADOS',                                                   
                                                        'PSWUNQ-REPORTE CONTRASEÑA UNICA TRIMESTRAL',
                                                        'AGRTRFDATOSM-AGREGADO DE TRAFICO DE DATOS MENSUAL',
                                                        'REPSAR-REPORTE SAR',
                                                        'OPELDI-REPORTES DE OPERADORES DE LARGA DISTANCIA INTERNACIONAL (PREPAGO-POSTAPGO)',
                                                        'ADQTDP-ADQUISICIÓN DE EQUIPOS EN TDP',
                                                        'ALTDEP-CONTRATOS CORTOS|ALTAS POR DEPARTAMENTOS',
                                                        'NIFI-PROCESOS NIFI',
                                                        'INPUT-SRVINPLTTAC-PLANTA TAC',
                                                        'INPUT-CARGA DE FUENTES ALDM',
                                                        'INPUT-INPSIVADAC-SIVADAC ORACLE',
                                                        'INPUT-ALDMLISTAQA-LISTAQA',
                                                        'INPUT-SRVINLGTIMER-LOG TIMER',
                                                        'INPUT-VISORWHLIST-WHITELIST',
                                                        'INPUT-VISORDETLOG-DETALLE DE BLACKLISTLOG',
                                                        'INPUT-VISORLIBBLQ-DETALLE LIBERACIÓN-BLOQUEO DE IMEI',
                                                        'INPUT-SRVINCATCEL-CATALOGO DE CELDAS',
                                                        'INPUT-SRVINTKPORT-TOKEN PORTABILIDAD',
                                                        'TISACTRLS-CONTROLES PLANTA TISA',
                                                        ] %}
                            <option value="{{ dev }}" {% if pase and pase.proceso == dev %}selected{% endif %}>{{ dev }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="field">
                        <label>Nombre Proceso</label>
                        <input type="text" name="name_proceso" value="{{ pase.name_proceso if pase else '' }}" required>
                    </div>

                    <div class="field">
                        <label>CTI</label>
                        <input type="text" name="cti" value="{{ pase.cti if pase else '' }}" required>
                    </div>

                </div>

                <!-- COLUMNA 2 -->
                <div class="col">

                    <div class="field">
                        <label>Tinkuy</label>
                        <input type="text" name="tinkuy" value="{{ pase.tinkuy if pase else '' }}" required>
                    </div>

                    <div class="field">
                        <label>Documentación</label>
                        <input type="text" name="documentacion" value="{{ pase.documentacion if pase else '' }}">
                    </div>

                    <div class="field">
                        <label>Link SharePoint</label>
                        <input type="url" name="link_sharepoint" value="{{ pase.link_sharepoint if pase else '' }}">
                    </div>

                    <div class="field">
                        <label>Tipo</label>
                        <select name="tipo" required>
                            {% for dev in ['DEFAULT','REGULAR','OPTIMIZADO','INCIDENCIA'] %}
                            <option value="{{ dev }}" {% if pase and pase.tipo == dev %}selected{% endif %}>{{ dev }}</option>
                            {% endfor %}
                        </select>
                    </div>

                </div>

                <!-- COLUMNA 3 -->
                <div class="col">

                    <div class="field">
                        <label>Desarrollador BI</label>
                        <select name="desarrolladorbi" required>
                            {% for dev in ['DEFAULT','OSCAR CAPARO', 'EDWIN GARCÍA', 'HIMBHER LAZO', 'CHARLES MIRANDA', 'RICHARD CORREA','KARLA MEJIA', 'JOSE FALCON'] %}
                            <option value="{{ dev }}" {% if pase and pase.desarrolladorbi == dev %}selected{% endif %}>{{ dev }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="field">
                        <label>Líder Integratel</label>
                        <select name="liderintegratel" required>
                            {% for dev in ['DEFAULT','PEDRO MORENO','BACILIO GONZALES', 'JOSE FALCON', 'KARLA MEJIA'] %}
                            <option value="{{ dev }}" {% if pase and pase.liderintegratel == dev %}selected{% endif %}>{{ dev }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="field">
                        <label>Responsable PAP</label>
                        <select name="responsablepap" required>
                            {% for dev in ['DEFAULT','PEDRO MORENO','ANTHONY VILLACORTA'] %}
                            <option value="{{ dev }}" {% if pase and pase.responsablepap == dev %}selected{% endif %}>{{ dev }}</option>
                            {% endfor %}
                        </select>
                    </div>

                </div>

            </div>

            <div class="actions">
                <button type="button" class="btn-save" onclick="window.guardarPase()">
                    💾 Guardar
                </button>

                <button type="button" class="btn-cancel" id="btnCancelar" onclick="window.irFormulario('/pases')">
                    ❌ Cancelar
                </button>
            </div>

        </form>

    </div>

</div>

window.guardarPase = function() {
    const form = document.getElementById("pasesForm");
    const formData = new FormData(form);

    fetch("/pases/guardar", {
        method: "POST",
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            window.irFormulario('/pases');
        } else {
            alert(data.message || "Error al guardar");
        }
    })
    .catch(err => {
        console.error(err);
        alert("Error al guardar");
    });
};

window.irFormulario = function(url) {
    if (typeof cargarContenido === "function") {
        cargarContenido(url);
    } else {
        window.location.href = url;
    }
};
