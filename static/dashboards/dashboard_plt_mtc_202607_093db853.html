    if (
        valor === null ||
        valor === undefined ||
        isNaN(valor)
    ) {
        return "0";
    }

    const numero = Number(valor);

    if (Math.abs(numero) >= 1000000000) {

        return (
            (numero / 1000000000)
            .toFixed(1)
            .replace(/\.0$/, "")
            + "B"
        );
    }

    if (Math.abs(numero) >= 1000000) {

        return (
            (numero / 1000000)
            .toFixed(1)
            .replace(/\.0$/, "")
            + "M"
        );
    }

    if (Math.abs(numero) >= 1000) {

        return (
            (numero / 1000)
            .toFixed(1)
            .replace(/\.0$/, "")
            + "K"
        );
    }

    return numero.toLocaleString(
        "es-PE",
        {
            maximumFractionDigits: 2
        }
    );
}

/* ==========================================================

   ========================================================== */

function numero(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return 0;
    }

    const n = Number(valor);

    return isNaN(n)
        ? 0
        : n;
}


/* ==========================================================
   AGRUPAR
   ========================================================== */

function agrupar(
    datos,
    campo,
    metrica
) {

    const mapa = {};

    datos.forEach(
        function (fila) {

            const clave =
                String(
                    fila[campo] ?? "Sin dato"
                );

            const valor =
                numero(
                    fila[metrica]
                );

            if (
                !mapa[clave]
            ) {

                mapa[clave] = 0;
            }

            mapa[clave] += valor;

        }
    );

    return Object.entries(
        mapa
    );
}

                    "div"
                );

            grupo.className =
                "filter-group";

            const label =
                document.createElement(
                    "label"
                );

            label.textContent =
                filtro.campo;

            const select =
                document.createElement(
                    "select"
                );

            select.dataset.campo =
                filtro.campo;

            const todos =
                document.createElement(
                    "option"
                );

            todos.value = "";

            todos.textContent =
                "Todos";

            select.appendChild(
                todos
            );

            filtro.valores.forEach(
                function (valor) {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        valor;

                    option.textContent =
                        valor;

                    select.appendChild(
                        option
                    );
                }
            );

            select.addEventListener(
                "change",
                aplicarFiltros
            );

            grupo.appendChild(
                label
            );

            grupo.appendChild(
                select
            );

            contenedor.appendChild(
                grupo
            );

        }
    );
}


/* ==========================================================
   APLICAR FILTROS
   ========================================================== */

function aplicarFiltros() {

    const selects =
        document.querySelectorAll(
            "#filtersGrid select"
        );

    const activos = {};

    selects.forEach(
        function (select) {

            if (select.value) {

                activos[
                    select.dataset.campo
                ] = select.value;

            }

        }
    );

    datosFiltrados =
        DATOS.filter(
            function (fila) {

                return Object.entries(
                    activos
                ).every(
                    function ([campo, valor]) {

                        return String(
                            fila[campo]
                        ) === valor;

                    }
                );

            }
        );

    actualizarDashboard();
}


/* ==========================================================
   RESET
   ========================================================== */

document
    .getElementById(
        "btnReset"
    )
    .addEventListener(
        "click",
        function () {

            document
                .querySelectorAll(
                    "#filtersGrid select"
                )
                .forEach(
                    function (select) {

                        select.value = "";

                    }
                );

            datosFiltrados =
                [...DATOS];

            actualizarDashboard();

        }
    );


/* ==========================================================
   KPIs
   ========================================================== */

function generarKPIs() {
    const contenedor =
        document.getElementById("kpiGrid");

    contenedor.innerHTML = "";

    const metricasDisponibles =
        METRICAS.length
            ? METRICAS
            : (METRICA ? [METRICA] : []);

    metricasDisponibles
        .slice(0, 4)
        .forEach(function(campo) {
            const total =
                datosFiltrados.reduce(
                    function(suma, fila) {
                        return suma +
                            numero(
                                fila[campo]
                            );
                    },
                    0
                );

            const card =
                document.createElement("div");

            card.className =
                "kpi-card";

            card.innerHTML = `
                <div class="kpi-label">
                    ${tituloCampo(campo)}
                </div>
                <div class="kpi-value">
                    ${formatoNumero(total)}
                </div>
                <div class="kpi-detail">
                    Total calculado sobre los datos filtrados
                </div>
            `;

            contenedor.appendChild(card);
        });
}

/* ==========================================================
   GRÁFICOS DINÁMICOS SEGÚN PLANNER
   ========================================================== */

function tituloCampo(campo) {
    if (!campo) return "";
    return String(campo)
        .replace(/_/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function crearTarjetaGrafico(indice, elemento) {
    const grid = document.getElementById("chartsGrid");

    const card = document.createElement("div");
    card.className = "chart-card";

    const titulo = document.createElement("div");
    titulo.className = "chart-title";
    titulo.textContent =
        elemento.titulo ||
        (
            tituloCampo(
                elemento.eje_y ||
                elemento.valor ||
                elemento.metrica ||
                METRICA
            ) +
            (
                elemento.eje_x
                    ? " por " + tituloCampo(elemento.eje_x)
                    : ""
            )
        ) ||
        "Visualización";

    const subtitulo = document.createElement("div");
    subtitulo.className = "chart-subtitle";
    subtitulo.textContent =
        elemento.tipo
            ? "Tipo: " + elemento.tipo
            : "Visualización generada automáticamente";

    const chart = document.createElement("div");
    chart.className = "chart";
    chart.id = "chartDynamic_" + indice;

    card.appendChild(titulo);
    card.appendChild(subtitulo);
    card.appendChild(chart);
    grid.appendChild(card);

    return chart;
}

function agruparTriple(datos, campoX, campoY, metrica) {
    const mapa = {};

    datos.forEach(function(fila) {
        const x = String(fila[campoX] ?? "Sin dato");
        const y = String(fila[campoY] ?? "Sin dato");
        const clave = x + "|||" + y;

        if (!mapa[clave]) {
            mapa[clave] = 0;
        }

        mapa[clave] += numero(fila[metrica]);
    });

    return Object.entries(mapa).map(function(par) {
        const partes = par[0].split("|||");
        return {
            x: partes[0],
            y: partes[1],
            valor: par[1]
        };
    });
}

function renderBarAgrupado(
    contenedor,
    campoX,
    agrupacion,
    metrica
) {
    const mapa = {};

    datosFiltrados.forEach(function(fila) {
        const x = String(fila[campoX] ?? "Sin dato");
        const grupo = String(fila[agrupacion] ?? "Sin dato");

        if (!mapa[grupo]) {
            mapa[grupo] = {};
        }

        if (!mapa[grupo][x]) {
            mapa[grupo][x] = 0;
        }

        mapa[grupo][x] += numero(fila[metrica]);
    });

    const categorias = [
        ...new Set(
            Object.values(mapa)
                .flatMap(function(obj) {
                    return Object.keys(obj);
                })
        )
    ].slice(0, 20);

    const traces = Object.keys(mapa).map(function(grupo) {
        return {
            x: categorias,
            y: categorias.map(function(categoria) {
                return mapa[grupo][categoria] || 0;
            }),
            type: "bar",
            name: grupo
        };
    });

    Plotly.react(
        contenedor,
        traces,
        {
            ...LAYOUT_BASE,
            barmode: "group",
            xaxis: {
                automargin: true,
                tickangle: -30
            },
            yaxis: {
                title: metrica,
                tickformat: ",.2s"
            }
        },
        CONFIG_PLOTLY
    );
}

function renderGrafico(elemento, contenedor) {
    if (!elemento || !contenedor) return;

    const tipo = String(
        elemento.tipo || "bar"
    ).toLowerCase();

    const campoX =
        elemento.eje_x ||
        elemento.dimension ||
        elemento.campo;

    const campoY =
        elemento.eje_y ||
        elemento.metrica ||
        elemento.valor ||
        METRICA;

    const agrupacion =
        elemento.agrupacion;

    if (
        tipo === "kpi" ||
        tipo === "table"
    ) {
        return;
    }

    if (
        tipo === "heatmap"
    ) {
        const ejeX = elemento.eje_x;
        const ejeY = elemento.eje_y;
        const valor = elemento.valor || METRICA;

        if (!ejeX || !ejeY || !valor) {
            contenedor.innerHTML =
                "<p style='padding:20px'>No hay campos suficientes para el mapa.</p>";
            return;
        }

        const filas = agruparTriple(
            datosFiltrados,
            ejeX,
            ejeY,
            valor
        );

        const xValues = [
            ...new Set(
                filas.map(function(item) {
                    return item.x;
                })
            )
        ];

        const yValues = [
            ...new Set(
                filas.map(function(item) {
                    return item.y;
                })
            )
        ];

        const z = yValues.map(function(y) {
            return xValues.map(function(x) {
                const encontrado = filas.find(function(item) {
                    return (
                        item.x === x &&
                        item.y === y
                    );
                });

                return encontrado
                    ? encontrado.valor
                    : 0;
            });
        });

        Plotly.react(
            contenedor,
            [{
                x: xValues,
                y: yValues,
                z: z,
                type: "heatmap",
                hovertemplate:
                    ejeX + ": %{x}<br>" +
                    ejeY + ": %{y}<br>" +
                    valor + ": %{z:,.0f}" +
                    "<extra></extra>"
            }],
            {
                ...LAYOUT_BASE,
                xaxis: {
                    automargin: true
                },
                yaxis: {
                    automargin: true
                }
            },
            CONFIG_PLOTLY
        );

        return;
    }

    if (!campoX) {
        contenedor.innerHTML =
            "<p style='padding:20px'>No existe una dimensión para esta visualización.</p>";
        return;
    }

    if (
        tipo === "line" &&
        (!FECHAS.length ||
         FECHAS.indexOf(campoX) === -1)
    ) {
        contenedor.innerHTML =
            "<p style='padding:20px'>No se generó tendencia porque no existe un campo temporal válido.</p>";
        return;
    }

    const agrupado = agrupar(
        datosFiltrados,
        campoX,
        campoY
    );

    agrupado.sort(function(a, b) {
        return b[1] - a[1];
    });

    const top = agrupado.slice(0, 20);

    if (
        tipo === "donut" ||
        tipo === "pie"
    ) {
        Plotly.react(
            contenedor,
            [{
                labels: top.map(function(item) {
                    return item[0];
                }),
                values: top.map(function(item) {
                    return item[1];
                }),
                type: "pie",
                hole:
                    tipo === "donut"
                        ? 0.58
                        : 0,
                textinfo: "label+percent",
                hovertemplate:
                    "%{label}<br>" +
                    campoY +
                    ": %{value:,.0f}<br>" +
                    "%{percent}<extra></extra>"
            }],
            {
                ...LAYOUT_BASE,
                showlegend: true,
                legend: {
                    orientation: "h",
                    y: -0.08
                }
            },
            CONFIG_PLOTLY
        );

        return;
    }

    if (tipo === "line") {
        top.sort(function(a, b) {
            return String(a[0]).localeCompare(
                String(b[0]),
                undefined,
                { numeric: true }
            );
        });

        Plotly.react(
            contenedor,
            [{
                x: top.map(function(item) {
                    return item[0];
                }),
                y: top.map(function(item) {
                    return item[1];
                }),
                type: "scatter",
                mode: "lines+markers",
                line: {
                    width: 3,
                    shape: "spline"
                },
                marker: {
                    size: 7
                },
                hovertemplate:
                    "%{x}<br>" +
                    campoY +
                    ": %{y:,.0f}<extra></extra>"
            }],
            {
                ...LAYOUT_BASE,
                showlegend: false
            },
            CONFIG_PLOTLY
        );

        return;
    }

    if (
        agrupacion &&
        agrupacion !== campoX
    ) {
        renderBarAgrupado(
            contenedor,
            campoX,
            agrupacion,
            campoY
        );
        return;
    }

    Plotly.react(
        contenedor,
        [{
            x: top.map(function(item) {
                return item[0];
            }),
            y: top.map(function(item) {
                return item[1];
            }),
            type: "bar",
            hovertemplate:
                "%{x}<br>" +
                campoY +
                ": %{y:,.0f}<extra></extra>"
        }],
        {
            ...LAYOUT_BASE,
            showlegend: false,
            xaxis: {
                automargin: true,
                tickangle: -30
            },
            yaxis: {
                title: campoY,
                tickformat: ",.2s"
            }
        },
        CONFIG_PLOTLY
    );
}

function generarGraficos() {
    const grid =
        document.getElementById("chartsGrid");

    grid.innerHTML = "";

    const elementosGraficos =
        ELEMENTOS.filter(function(elemento) {
            const tipo =
                String(
                    elemento.tipo || ""
                ).toLowerCase();

            return (
                tipo !== "kpi" &&
                tipo !== "table"
            );
        });

    if (elementosGraficos.length) {
        elementosGraficos.forEach(
            function(elemento, indice) {
                const contenedor =
                    crearTarjetaGrafico(
                        indice,
                        elemento
                    );

                renderGrafico(
                    elemento,
                    contenedor
                );
            }
        );

        return;
    }

    // Fallback mínimo: solamente si el Planner no entregó
    // elementos visuales. Nunca crea una tendencia sin fechas.
    if (
        DIMENSIONES.length &&
        METRICA
    ) {
        const elemento = {
            tipo: "bar",
            eje_x: DIMENSIONES[0],
            eje_y: METRICA,
            titulo:
                tituloCampo(METRICA) +
                " por " +
                tituloCampo(DIMENSIONES[0])
        };

        const contenedor =
            crearTarjetaGrafico(
                0,
                elemento
            );

        renderGrafico(
            elemento,
            contenedor
        );
    }
}

/* ==========================================================
   TABLA
   ========================================================== */

function generarTabla() {

    const head =
        document.getElementById(
            "tableHead"
        );

    const body =
        document.getElementById(
            "tableBody"
        );

    const info =
        document.getElementById(
            "tableInfo"
        );

    head.innerHTML = "";

    body.innerHTML = "";

    const filaHead =
        document.createElement(
            "tr"
        );

    const columnasTabla =
        [...DIMENSIONES, ...METRICAS]
            .filter(function(valor, indice, arreglo) {
                return (
                    valor &&
                    arreglo.indexOf(valor) === indice
                );
            });

    const columnasMostrar =
        columnasTabla.length
            ? columnasTabla
            : COLUMNAS;

    columnasMostrar.forEach(
        function (columna) {

            const th =
                document.createElement(
                    "th"
                );

            th.textContent =
                columna;

            filaHead.appendChild(
                th
            );

        }
    );

    head.appendChild(
        filaHead
    );


    /*
     * Mostramos máximo 100 registros
     * en la vista inicial.
     */

    const filas =
        datosFiltrados.slice(
            0,
            100
        );

    filas.forEach(
        function (fila) {

            const tr =
                document.createElement(
                    "tr"
                );

            const columnasTabla =
        [...DIMENSIONES, ...METRICAS]
            .filter(function(valor, indice, arreglo) {
                return (
                    valor &&
                    arreglo.indexOf(valor) === indice
                );
            });

    const columnasMostrar =
        columnasTabla.length
            ? columnasTabla
            : COLUMNAS;

    columnasMostrar.forEach(
                function (columna) {

                    const td =
                        document.createElement(
                            "td"
                        );

                    const valor =
                        fila[columna];

                    if (
                        typeof valor ===
                        "number"
                    ) {

                        td.textContent =
                            valor.toLocaleString(
                                "es-PE",
                                {
                                    maximumFractionDigits: 2
                                }
                            );

                    }
                    else {

                        td.textContent =
                            valor ?? "";

                    }

                    tr.appendChild(
                        td
                    );

                }
            );

            body.appendChild(
                tr
            );

        }
    );

    info.textContent =
        "Mostrando " +
        filas.length +
        " de " +
        datosFiltrados.length +
        " registros";
}


/* ==========================================================
   ACTUALIZAR TODO
   ========================================================== */

function actualizarDashboard() {

    generarKPIs();

    generarGraficos();

    generarTabla();
}


/* ==========================================================
   INICIO
   ========================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        crearFiltros();

        actualizarDashboard();

    }
);
